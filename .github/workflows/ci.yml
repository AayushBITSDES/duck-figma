name: CI

# Read-only: this workflow only builds and tests, it never writes to the repo.
permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs, not tags. A tag can be repointed after review,
      # which would silently run different code against the checked-out repo
      # and the workflow token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      - name: Install plugin dependencies
        run: npm ci

      - name: Install Worker dependencies
        run: npm ci --prefix worker

      - name: Test plugin source
        run: npm test

      - name: Test and typecheck Worker
        run: |
          npm run test:worker
          npm run typecheck:worker

      - name: Build
        run: npm run build

      # These load dist/ rather than src/, so they only mean anything after a
      # build. They catch what the unit tests structurally cannot: the webpack
      # ESM bundle failing to boot where the CommonJS test build is fine, and
      # controls wired with addEventListener that no exported function touches.
      - name: Test the shipped bundle
        run: npm run test:bundle

      # manifest.json loads dist/ directly, so dist IS the shipped plugin. If it
      # drifts from src, FigJam quietly runs stale code and no test would catch
      # it. This fails the build rather than letting that ship.
      - name: dist is up to date with src
        run: |
          if ! git diff --quiet -- dist/; then
            echo "dist/ does not match a fresh build of src/. Run 'npm run build' and commit the result."
            git diff --stat -- dist/
            exit 1
          fi
