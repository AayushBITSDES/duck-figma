<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  body { margin: 0; font-family: Inter, sans-serif; background: transparent; }
  #root { display: flex; justify-content: flex-end; align-items: flex-end; height: 100vh; padding: 12px; box-sizing: border-box; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .panel {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    padding: 14px;
    width: 240px;
  }
  .msg { font-size: 13px; color: #333; line-height: 1.4; }
  .moods { display: flex; flex-direction: column; gap: 6px; }
  .moods button, .actions button {
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid #ddd;
    background: #FFF7E0;
    cursor: pointer;
    font-size: 12px;
    text-align: left;
  }
  .moods button:hover, .actions button:hover { background: #FFEFC2; }
  .dismiss {
    margin-top: 8px;
    background: none;
    border: none;
    color: #888;
    cursor: pointer;
    font-size: 11px;
  }
  textarea, input {
    border-radius: 8px;
    border: 1px solid #ddd;
    padding: 6px;
    font-size: 12px;
    resize: none;
    box-sizing: border-box;
    font-family: inherit;
  }
  .actions { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
</style>
</head>
<body>
<div id="root"></div>
</body>
</html>
