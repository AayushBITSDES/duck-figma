<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  /* Figma injects --figma-color-* and a figma-light/figma-dark class on <html>
     because showUI passes themeColors. Everything here is built on those, so the
     panel tracks the editor's theme instead of guessing at it.

     Metrics follow Figma's own panels, because this window sits eight pixels
     from them: an 8px grid, 24px small controls and 28px default ones, 5px
     radii, centred button labels, and hairline dividers instead of cards.
     Anything that departs from that reads as a foreign app inside the editor. */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: var(--duck-font, 11px);
    line-height: 1.45;
    color: var(--figma-color-text);
    background: var(--figma-color-bg);
    -webkit-font-smoothing: antialiased;
  }
  #root { height: 100vh; }
  .screen { display: flex; flex-direction: column; height: 100%; }

  /* The header carries the round and what the round wants from you, in the
     editor's own label register: the round number recedes, the demand does
     not. It replaces the old title-plus-status line, which spent the width on
     the plugin's own name. */
  .hdr {
    flex: 0 0 auto;
    display: flex; align-items: baseline; gap: 6px;
    padding: 8px 8px 6px;
  }
  .hdr-title { font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--figma-color-text-secondary); }
  .hdr-sub { font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .hdr-dot { color: var(--figma-color-text-secondary); }

  .body { flex: 1 1 auto; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
  .ftr { flex: 0 0 auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--figma-color-border); }
  .row { display: flex; gap: 6px; }
  .row > * { flex: 1; min-width: 0; }
  /* The utility row is not the turn: it sits at label size, borderless, and
     never at the same weight as Send. Six identical full-width buttons were
     eating 219px of a 380px panel, which is what left the thread with none. */
  .row.util { gap: 2px; }
  .row.util > button { flex: 0 0 auto; }
  .muted { color: var(--figma-color-text-secondary); }
  .tiny { font-size: calc(var(--duck-font, 11px) - 1px); }

  /* One segment per participant, capped at six by the session itself. Colour
     is the whole vocabulary: brand for in, border for still out, secondary
     text for passed. It replaces the presence chips, the round line and the
     header subtitle, which all printed the same fact in three places. */
  .rail {
    flex: 0 0 auto;
    display: flex; gap: 4px;
    padding: 0 8px 8px;
  }
  .seg {
    flex: 1 1 0; min-width: 0; height: 4px; border-radius: 2px;
    background: var(--figma-color-border);
  }
  .seg.in { background: var(--figma-color-bg-brand); }
  .seg.passed { background: var(--figma-color-text-secondary); }
  .seg.you { box-shadow: 0 0 0 1px var(--figma-color-bg); outline: 1px solid var(--figma-color-text); outline-offset: 1px; }

  /* The blocker bar only exists while someone is holding the round up. It is
     the one place that can end the wait, so it keeps a border and sits above
     the thread rather than inside it. */
  .blocker {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 6px;
    margin: 0 8px 8px; padding: 6px 8px;
    border: 1px solid var(--figma-color-border);
    border-radius: var(--r, 5px);
  }
  .blocker-text { flex: 1 1 auto; min-width: 0; }
  .blocker-clock { flex: 0 0 auto; font-variant-numeric: tabular-nums; color: var(--figma-color-text-secondary); }

  .round { flex: 0 0 auto; margin: 0; padding: 0 8px 8px; }
  .stack { display: flex; flex-direction: column; gap: 2px; max-width: 82%; }
  .turn.mine .stack { align-items: flex-end; }
  .who { color: var(--figma-color-text-secondary); font-size: calc(var(--duck-font, 11px) - 1px); }
  .stack .bubble { max-width: 100%; }

  button {
    /* min-height, not height: a fixed box clipped its own label the moment
       --duck-font went past about 14px, which is most of the range the
       settings screen offers. The floor keeps the hit target comfortable at
       the small end, and the padding lets it grow from there.
       Centred, because a left-aligned label is the tell that this was not
       built to sit next to Figma's own controls. */
    font: inherit; min-height: 28px; padding: 4px 8px;
    border-radius: 5px; border: 1px solid var(--figma-color-border);
    background: var(--figma-color-bg); color: var(--figma-color-text);
    cursor: pointer; text-align: center; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  button:hover { background: var(--figma-color-bg-secondary); }
  button.primary { background: var(--figma-color-bg-brand); color: var(--figma-color-text-onbrand); border-color: transparent; }
  button.primary:hover { background: var(--figma-color-bg-brand-hover); }
  button.primary:active { background: var(--figma-color-bg-brand-pressed); }
  button.ghost { border-color: transparent; color: var(--figma-color-text-secondary); background: none; }
  button.ghost:hover { color: var(--figma-color-text); background: var(--figma-color-bg-secondary); }
  /* Utilities sit at Figma's small control height and label colour, so the
     eye sorts them below the turn without having to read them. */
  button.small { min-height: 24px; padding: 3px 6px; font-size: calc(var(--duck-font, 11px) - 1px); }
  button:disabled { opacity: 0.4; cursor: default; }
  button:disabled:hover { background: var(--figma-color-bg); }
  button.ghost:disabled:hover { background: none; }

  /* Mood chips are the starting question's answers, not a permanent control
     surface, so they wrap on the grid instead of stacking full-width. */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips > button { flex: 0 1 auto; }

  input, select, textarea {
    font: inherit; width: 100%; padding: 5px 8px;
    border-radius: 5px; border: 1px solid var(--figma-color-border);
    background: var(--figma-color-bg); color: var(--figma-color-text);
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--figma-color-border-selected);
    box-shadow: inset 0 0 0 1px var(--figma-color-border-selected);
  }
  textarea { resize: none; }
  label { display: block; margin-bottom: 4px; color: var(--figma-color-text-secondary); }

  .turn { display: flex; gap: 6px; align-items: flex-end; }
  .turn.mine { justify-content: flex-end; }
  .bubble { border-radius: 8px; padding: 7px 9px; max-width: 82%; }
  .bubble.them { background: var(--figma-color-bg-secondary); }
  .bubble.mine { background: var(--figma-color-bg-brand); color: var(--figma-color-text-onbrand); }
  .bubble.err { border: 1px solid var(--figma-color-border-danger-strong); color: var(--figma-color-text-danger); }
  .bubble p { margin: 0; }
  .bubble p + p { margin-top: 6px; }
  .bubble ul, .bubble ol { margin: 0; padding-left: 18px; }
  /* em, not px: this was the one rule that ignored --duck-font, so code spans
     stayed 10px while everything around them grew. */
  .bubble code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.9em; background: rgba(127, 127, 127, 0.16); border-radius: 3px; padding: 1px 3px; }
  /* A long unbroken line (a URL, a hash) must scroll inside the code block
     rather than force the whole 280px panel to scroll sideways. */
  .bubble pre { margin: 0; overflow-x: auto; background: rgba(127, 127, 127, 0.16); border-radius: 6px; padding: 6px 8px; }
  .bubble pre code { background: none; padding: 0; }

  /* Connecting: the duck is chrome, not a control. */
  .idle { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; height: 100%; padding: 12px; text-align: center; }
  .idle-duck { animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @media (prefers-reduced-motion: reduce) { .idle-duck { animation: none; } }

  /* Collapsed: the whole 70x70 window is duck, and the whole thing is the
     click target. 70 is figma.showUI's hard floor for width.
     The duck is still by default and bobs only when the round is waiting on
     this user: an always-bobbing duck said nothing, because a signal that is
     always on is not a signal. */
  .collapsed { display: flex; align-items: center; justify-content: center;
    height: 100vh; cursor: pointer; }
  .collapsed.turn { animation: bob 2.6s ease-in-out infinite; }
  .collapsed:hover { animation-play-state: paused; }
  /* Reduced motion removes the only cue the bob was carrying, so the tile
     itself has to speak: brand fill behind a knocked-out duck. */
  @media (prefers-reduced-motion: reduce) {
    .collapsed.turn { animation: none; background: var(--figma-color-bg-brand); color: var(--figma-color-text-onbrand); }
  }
  /* The general button rule would otherwise give this a border, min-height,
     and ellipsis — all wrong for a 70x70 icon that is the whole window. */
  button.collapsed {
    width: 100%; min-height: 0; padding: 0; border: none;
    background: transparent; white-space: normal; overflow: visible;
    text-overflow: clip; color: inherit;
  }
  button.collapsed:hover,
  button.collapsed:disabled:hover { background: transparent; }

  /* min-height on button would win over this height, so it is reset here.
     This one is an icon, not a label: it should stay 18px at every text size. */
  button.mini { position: absolute; top: 6px; right: 6px; height: 18px;
    min-height: 0; width: 18px; padding: 0; text-align: center; line-height: 1;
    opacity: 0.5; }
  button.mini:hover { opacity: 1; }

  /* Figma gives a plugin window no resize handle of its own and fires no
     resize event, so the panel has to draw its own grips and ask the plugin
     to resize. Kept out of #root so they survive every screen repaint.
     Three of them: the corner drives both axes, the edges lock to one, so
     widening the panel doesn't drag its height along for the ride. */
  #grip-e, #grip-s, #grip { position: fixed; touch-action: none; }
  /* 6px strips. The body's own padding is 8px and the minimize button sits
     6px in from the right at 18px wide, so neither strip covers a control. */
  #grip-e { top: 0; right: 0; width: 6px; height: 100vh; cursor: ew-resize; }
  #grip-s { left: 0; bottom: 0; height: 6px; width: 100vw; cursor: ns-resize; }
  /* Last so it wins the overlap at the corner where all three meet. */
  #grip { right: 0; bottom: 0; width: 14px; height: 14px;
    cursor: nwse-resize; }
  #grip::after { content: ''; position: absolute; right: 3px; bottom: 3px;
    width: 6px; height: 6px;
    border-right: 1.5px solid var(--figma-color-text-secondary);
    border-bottom: 1.5px solid var(--figma-color-text-secondary);
    opacity: 0.6; }
  /* The collapsed screen renders inside #root, and #grip is #root's sibling,
     so no selector built on the collapsed markup itself (".collapsed ~
     #grip") can ever reach it. bridge.ts toggles this class on <body> in
     step with state.minimized instead, which display:none then makes fully
     inert: no cursor, no hit target, dragging or clicking it does nothing. */
  body.min #grip, body.min #grip-e, body.min #grip-s { display: none; }
</style>
</head>
<body>
<div id="root"></div>
<div id="grip-e" role="separator" aria-label="Resize panel width"></div>
<div id="grip-s" role="separator" aria-label="Resize panel height"></div>
<div id="grip" role="separator" aria-label="Resize panel"></div>
</body>
</html>
